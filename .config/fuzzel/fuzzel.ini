# output=<not set>
font=Hack Nerd Font:size=16
dpi-aware=no
use-bold=yes
prompt="  "
placeholder=""
icon-theme=Tela-Purple
icons-enabled=yes
# hide-before-typing=no
fields=name,filename,generic,exec,keywords,comment
password-character=
filter-desktop=no
match-mode=fzf
sort-result=yes
match-counter=yes
# delayed-filter-ms=300
# delayed-filter-limit=20000
show-actions=yes
# terminal=$TERMINAL -e  # Note: you cannot actually use environment variables here
launch-prefix='app2unit --fuzzel-compat -- '
# list-executables-in-path=no

# anchor=center
# x-margin=0
# y-margin=0
lines=16
width=28
tabs=2
horizontal-pad=28
vertical-pad=20
inner-pad=10

# image-size-ratio=0.5

# line-height=<use font metrics>
line-height=21
# letter-spacing=0.3

# layer=top
# keyboard-focus=on-demand
# exit-on-keyboard-focus-loss=no

# cache=<not set>

# render-workers=<number of logical CPUs>
# match-workers=<number of logical CPUs>
[colors]
background=161616ff
text=f2f4f8ff
prompt=f2f4f8ff
placeholder=b6b8bbff
input=f2f4f8ff
match=78a9ffff
selection=343434ff
selection-text=F9FBFEff
selection-match=33b1ffff
selection-match=ff7eb6ff
counter=be95ffff
border=3ddbd9ff

[border]
width=1
radius=10

[dmenu]
# mode=text  # text|index
# exit-immediately-if-empty=no

[key-bindings]
cancel=Escape Control+c Control+bracketleft Control+braceleft
execute=Return KP_Enter Control+y
execute-or-next=none
execute-input=Shift+Return Shift+KP_Enter Control+Shift+y
cursor-left=Left Control+h
cursor-left-word=Control+Left
cursor-right=Right Control+l
cursor-right-word=Control+Right
cursor-home=none
cursor-end=none
delete-prev=BackSpace Control+s
delete-prev-word=Mod1+BackSpace Control+BackSpace Control+w
delete-line-backward=Control+u
delete-next=Delete KP_Delete Control+d
delete-next-word=Control+Delete Control+KP_Delete
delete-line-forward=Control+k
prev=Up Control+p
prev-with-wrap=ISO_Left_Tab
prev-page=Page_Up KP_Page_Up Control+b
next=Down Control+n
next-with-wrap=Tab
next-page=Page_Down KP_Page_Down Control+f
# expunge=Shift+Delete
clipboard-paste=Control+v XF86Paste
# primary-paste=Shift+Insert Shift+KP_Insert
first=Control+a Home
last=Control+e End

# custom-N: *dmenu mode only*. Like execute, but with a non-zero
# exit-code# custom-1 exits with code 10, custom-2 with 11, custom-3
# with 12, and so on.

# custom-1=Mod1+1
# custom-2=Mod1+2
# custom-3=Mod1+3
# custom-4=Mod1+4
# custom-5=Mod1+5
# custom-6=Mod1+6
# custom-7=Mod1+7
# custom-8=Mod1+8
# custom-9=Mod1+9
# custom-10=Mod1+0
# custom-11=Mod1+exclam
# custom-12=Mod1+at
# custom-13=Mod1+numbersign
# custom-14=Mod1+dollar
# custom-15=Mod1+percent
# custom-16=Mod1+dead_circumflex
# custom-17=Mod1+ampersand
# custom-18=Mod1+asterix
# custom-19=Mod1+parentleft
