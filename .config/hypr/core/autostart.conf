source = ~/.config/hypr/core/common.conf

# Wallpaper
exec-once = hyprpaper

# Autostart Polkit (to manage system-wide privileges)
exec-once = systemctl --user start hyprpolkitagent

# Autostart dunst (notificiation daemon, manages system notifications)
exec-once = /usr/bin/dunst

# Updates the list of environment variables
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Inhibit shutdown when pressing the power off key, instead run wlogout
exec-once = systemd-inhibit --who="Hyprland config" --why="wlogout keybind" --what=handle-power-key --mode=block sleep infinity & echo $! > /tmp/.hyprland-systemd-inhibit
exec-shutdown = kill -9 "$(cat /tmp/.hyprland-systemd-inhibit)

# Bluetooth
exec-once = bluetoothctl power off

# Idle manager
exec-once = hypridle
exec-once = ~/scripts/hypr/idleInhibitManager.fish

# Clipboard manager
exec-once = ~/.local/bin/clipse -listen

# Gamma/temperature filter
exec-once = brightnessctl --restore

# Watch events for various utilities
exec-once = $launchPrefix $hyprnim watch
exec-once = $hyprnim monitors

exec-once = [workspace special silent] $launchPrefix kitty --single-instance --class=nvim --hold --override confirm_os_window_close=0 -- fish -c orgfiles

# Status bar
exec-once = sleep 0.1 && waybar

exec-once = ~/scripts/hypr/onUnlock.sh

# exec-once = hyprpm reload # Load enabled plugins

# To fix waybar not showing system tray after using kde apps
