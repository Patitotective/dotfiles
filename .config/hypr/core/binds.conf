# See https://wiki.hyprland.org/Configuring/Binds/ and https://wiki.hyprland.org/Configuring/Keywords/
#
# Flags
# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# c -> click, will trigger on release of a key or button as long as the mouse cursor stays inside input:drag_threshold.
# g -> drag, will trigger on release of a key or button as long as the mouse cursor moves outside input:drag_threshold.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.
#
# Letters that haven't been binded: u, o, a, f, z, v
# Letters that have been binded: W, S, H, L, P, R, G, N
#
# wev = see key names
source = ~/.config/hypr/core/common.conf

binds {
    hide_special_on_workspace_change = true
    # allow_workspace_cycles = true # This is not what I want (firefox behavior of cycling through tabs)
    workspace_center_on = 1
    movefocus_cycles_fullscreen = true
    scroll_event_delay = 0
}

# note that without the r flag, waybar would be updated before the actual toggle happens and it wouldn't work
binditnlr = , caps_lock, exec, kill -SIGRTMIN+3 $(pgrep waybar)
binditnlr = , num_lock, exec, kill -SIGRTMIN+4 $(pgrep waybar)

################## VARIABLES ##################
$mainmod = SUPER_L # Windows key

$menu = ~/scripts/hypr/menu.fish
$powermenu = ~/scripts/hypr/powerMenu.sh

$emojipicker = pkill fuzzel || bemoji --noline --clip
# --noline -> to prevent a new line at the end
# --type -> to type the emoji directly
# --clip -> to copy the emoji as well
$colorpicker = pkill hyprpickerr || hyprpicker --autocopy --format=hex
$clipboard = pkill fuzzel || ~/scripts/hypr/cliphist-fuzzel-img.sh

$terminal = $launchprefix kitty --single-instance
$filemanager = $launchprefix kitty --single-instance --class=yazi --override confirm_os_window_close=0 yazi
$browser = $launchprefix floorp
$editor = $launchprefix kitty --single-instance --class=nvim --override confirm_os_window_close=0 nvim
#$music = $launchprefix spotify
$music = $launchprefix kitty --single-instance --class=spotify_player --override confirm_os_window_close=0 spotify_player
$mail = $launchprefix kitty --single-instance --class=aerc --override confirm_os_window_close=0 aerc
$calculator = $launchprefix kalk
$bluetooth = bzmenu --launcher fuzzel --spaces 2 
$wifi = networkmanager_dmenu
$calendar = $launchprefix kitty --single-instance --class=khal --override confirm_os_window_close=0 ikhal

################## APPLICATIONS ##################
bind = $mainmod, t, exec, $terminal
bind = $mainmod, e, exec, $filemanager
bind = $mainmod, b, exec, $browser
bind = $mainmod, c, exec, $calendar
bind = $mainmod shift, c, exec, $colorpicker
bind = $mainmod, m, exec, $mail
bind = $mainmod, xf86audioplay, exec, $music
bind = , xf86tools, exec, $music
bind = $mainmod, F11, exec, $calculator

bind = $mainmod, n, exec, ~/scripts/hypr/nvim-everywhere.fish

################## MENUS ##################
# bindl = $mainmod, escape, exec, $powermenu # I end up pressing this on accident
bindl = $mainmod, Pause, exec, $powermenu
bind = $mainmod, space, exec, $menu
bind = $mainmod, period, exec, $emojipicker
bind = $mainmod, bar, exec, $clipboard # bar=|
bindl = , xf86poweroff, exec, $powermenu

################## SYSTEM TRAY MENU? ##################
bind = $mainmod, ntilde, submap, systraymenu # ñ
submap = systraymenu
bind = , escape, submap, reset

bind = , b, exec, $bluetooth
bind = , b, submap, reset

bind = , w, exec, $wifi
bind = , w, submap, reset

bindr = , catchall, submap, reset
submap = reset

################## NOTIFICATIONS ##################
bind = $mainmod shift, n, submap, notifications
submap = notifications
bind = , escape, submap, reset

bind = , d, exec, dunstctl close
bind = , d, submap, reset

bind = shift, d, exec, dunstctl close-all
bind = shift, d, submap, reset

bind = , p, exec, dunstctl history-pop

bind = , l, exec, dunstctl action
bind = , l, submap, reset

bindr = , catchall, submap, reset
submap = reset

################## SCREENSHOTS ##################
$screenshotcmd = grimblast --notify --openfile --freeze copysave
# $screenshotcmd = grimblast --freeze copysave

bind = , print, exec, $screenshotcmd screen  # Screenshot entire screen + clipboard copy
bind = $mainmod, print, exec, $screenshotcmd active # Screenshot current Active window only + clipboard copy
bind = shift, print, exec, $screenshotcmd area # Select area to take screenshot

################## LAYOUT ##################
bind = $mainmod shift, p, togglesplit

bind = $mainmod, y, exec, ~/scripts/hypr/toggleLayout.sh

################## SOUND ##################
$soundstep = 5
$soundbigstep = 20

$soundup = ~/scripts/hypr/setVolume.sh +$soundstep
$sounddown = ~/scripts/hypr/setVolume.sh -$soundstep

$soundbigup = ~/scripts/hypr/setVolume.sh +$soundbigstep
$soundbigdown = ~/scripts/hypr/setVolume.sh -$soundbigstep

bindel = , xf86audioraisevolume, exec, $soundup
bindel = , xf86audiolowervolume, exec, $sounddown
bindel = shift, xf86audioraisevolume, exec, $soundbigup
bindel = shift, xf86audiolowervolume, exec, $soundbigdown

bindel = $mainmod, down, exec, $sounddown
bindel = $mainmod, up, exec, $soundup
bindel = $mainmod shift, down, exec, $soundbigdown
bindel = $mainmod shift, up, exec, $soundbigup

bindel = , xf86audiomute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = , xf86audiomicmute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

################## BRIGHTNESS ##################
$brightnessstep = 0.05 # 5%
$brightnessbigstep = 0.2 # 20%

$brightnessup = $hyprnim brightness p$brightnessstep
$brightnessdown = $hyprnim brightness m$brightnessstep

$brightnessbigup = $hyprnim brightness p$brightnessbigstep
$brightnessbigdown = $hyprnim brightness m$brightnessbigstep

bindel = , xf86monbrightnessdown, exec, $brightnessdown
bindel = , xf86monbrightnessup, exec, $brightnessup
bindel = shift, xf86monbrightnessdown, exec, $brightnessbigdown
bindel = shift, xf86monbrightnessup, exec, $brightnessbigup

bindel = $mainmod, left, exec, $brightnessdown
bindel = $mainmod, right, exec, $brightnessup
bindel = $mainmod shift, left, exec, $brightnessbigdown
bindel = $mainmod shift, right, exec, $brightnessbigup

################## PLAYER CONTROL ##################
bindl = , xf86audionext, exec, playerctl next
bindl = , xf86audiopause, exec, playerctl play-pause
bindl = , xf86audioplay, exec, playerctl play-pause
bindl = , xf86audioprev, exec, playerctl previous

################## LAPTOP LID ##################
bindl = , switch:on:Lid Switch, exec, ~/scripts/hypr/onLidClose.sh
bindl = , switch:off:Lid Switch, exec, ~/scripts/hypr/onLidOpen.sh

################## ZOOM ##################
bind = $mainmod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
bind = $mainmod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

binde = $mainmod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor 1)

binde = $mainmod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
binde = $mainmod, kp_subtract, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

binde = $mainmod, plus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = $mainmod, kp_add, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')

################## HYPR ##################
bind = $mainmod ctrl, escape, exec, killall waybar || waybar # Toggle waybar

bind = $mainmod, x, exec, ~/scripts/hypr/toggleEffects.sh

# bind = $mainmod, m, exec, ~/scripts/hypr/onExit.sh && uwsm stop # Exit hyprland

bindl = $mainmod shift, r, exec, hyprctl reload

bindl = $mainmod, f5, exec, $hyprnim monitors --all
# bindl = $mainmod, f6, exec, $hyprnim monitors --disableEnable
bindl = $mainmod, f6, exec, $hyprnim monitors

bindn = , mouse:273, exec, ~/scripts/hypr/desktopRightClick.fish

bindl = $mainmod, apostrophe, exec, ~/scripts/hypr/cycleShaders.fish
bindl = $mainmod shift, apostrophe, exec, ~/scripts/hypr/cycleShaders.fish -1

bind = $mainmod, i, exec, ~/scripts/hypr/toggleIdle.fish

################## GROUPS ##################
bind = $mainmod ctrl, tab, changegroupactive,
bind = $mainmod ctrl shift, tab, changegroupactive, b

bind = $mainmod shift, g, togglegroup

bind = $mainmod, g, exec, ~/scripts/hypr/enablegroup.fish
bind = $mainmod, g, submap, group
submap = group
bind = , escape, submap, reset

bind = , g, togglegroup

bind = shift, l, movewindoworgroup, r
bind = shift, h, movewindoworgroup, l
bind = shift, j, movewindoworgroup, d
bind = shift, k, movewindoworgroup, u

bind = , h, movefocus, l
bind = , l, movefocus, r
bind = , k, movefocus, u
bind = , j, movefocus, d

bind = , h, togglegroup, l
bind = , l, togglegroup, r
bind = , k, togglegroup, u
bind = , j, togglegroup, d

bind = ctrl, h, changegroupactive, b
bind = ctrl, l, changegroupactive, f

bindr = , catchall, submap, reset
submap = reset

################## WINDOWS ##################
bind = $mainmod, q, exec, hyprctl kill # Terminate a window by cliking it
bind = $mainmod, d, killactive, # Close current window

# bind = $mainmod ctrl, h, swapnext, prev
# bind = $mainmod ctrl, l, swapnext
bind = $mainmod, p, swapnext

bind = alt, tab, cyclenext, prev

bind = $mainmod, h, movefocus, l
bind = $mainmod, l, movefocus, r
bind = $mainmod, k, movefocus, u
bind = $mainmod, j, movefocus, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainmod, mouse:272, movewindow
bindm = $mainmod, mouse:273, resizewindow

bind = $mainmod, w, togglefloating
bind = $mainmod shift, w, pseudo, # dwindle

# bind = $mainmod, f, fullscreen
bind = , f11, fullscreen

################## WINDOW RESIZE ##################
$resizestep = 99 # 1920 / 20
$resizebigstep = 220 # 1980 / 8

bind = $mainmod, r, submap, resize
submap = resize
bind = , escape, submap, reset

bind = , h, resizeactive, -$resizestep 0
bind = , l, resizeactive, $resizestep 0
bind = , j, resizeactive, 0 -$resizestep
bind = , k, resizeactive, 0 $resizestep

bind = shift, h, resizeactive, -$resizebigstep 0
bind = shift, l, resizeactive, $resizebigstep 0
bind = shift, j, resizeactive, 0 -$resizebigstep
bind = shift, k, resizeactive, 0 $resizebigstep

bindr = , catchall, submap, reset
submap = reset

################## WORKSPACES ##################
bind = $mainmod, s, togglespecialworkspace
bind = , xf86presentation, togglespecialworkspace # Cause why not...
bind = $mainmod shift, s, movetoworkspace, special

# TODO: make this cycle respecting most recently used workspaces
# bind = $mainmod, tab, exec, ~/scripts/hypr/switchWorkspace.sh e+1
# bind = $mainmod shift, tab, exec, ~/scripts/hypr/switchWorkspace.sh e-1

bind = $mainmod shift, h, exec, ~/scripts/hypr/switchWorkspace.sh e-1
bind = $mainmod shift, l, exec, ~/scripts/hypr/switchWorkspace.sh e+1

bind = $mainmod, 1, workspace, 1
bind = $mainmod, 2, workspace, 2
bind = $mainmod, 3, workspace, 3
bind = $mainmod, 4, workspace, 4
bind = $mainmod, 5, workspace, 5
bind = $mainmod, 6, workspace, 6
bind = $mainmod, 7, workspace, 7
bind = $mainmod, 8, workspace, 8
bind = $mainmod, 9, workspace, 9
bind = $mainmod, 0, workspace, 10

bind = $mainmod ctrl, h, movetoworkspace, -1
bind = $mainmod ctrl, l, movetoworkspace, +1

bind = $mainmod shift, 1, movetoworkspace, 1
bind = $mainmod shift, 2, movetoworkspace, 2
bind = $mainmod shift, 3, movetoworkspace, 3
bind = $mainmod shift, 4, movetoworkspace, 4
bind = $mainmod shift, 5, movetoworkspace, 5
bind = $mainmod shift, 6, movetoworkspace, 6
bind = $mainmod shift, 7, movetoworkspace, 7
bind = $mainmod shift, 8, movetoworkspace, 8
bind = $mainmod shift, 9, movetoworkspace, 9
bind = $mainmod shift, 0, movetoworkspace, 10
