source = ~/.config/hypr/colors.conf

group {
    col.border_active = $color14
    col.border_locked_active = $color15
    col.border_inactive = $color4
    col.border_locked_inactive = $color4

	groupbar {
        enabled = true
        keep_upper_gap = false
        render_titles = false
        indicator_height = 2
        gaps_out = 2
        gaps_in = 4

        rounding = 10

		col.active = rgba($unlockedgroupbarff)
		col.inactive = rgba($unlockedgroupbar77)

		col.locked_active = rgba($lockedgroupbarff)
		col.locked_inactive = rgba($lockedgroupbar77)
  }
}
