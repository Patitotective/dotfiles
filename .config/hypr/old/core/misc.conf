misc {
    disable_hyprland_logo = true # disables the random Hyprland logo / anime girl background. :(
    disable_splash_rendering = true # disables the Hyprland splash rendering.
    force_default_wallpaper = 0

    mouse_move_enables_dpms = true # If DPMS is set to off, wake up the monitors if the mouse moves.
    key_press_enables_dpms = true

    animate_manual_resizes = true

    # vfr = true # lower the amount of sent frames when nothing is happening on-screen

    allow_session_lock_restore = true # if true, will allow you to restart a lockscreen app in case it crashes (red screen of death)

    close_special_on_empty = true # close the special workspace if the last window is removed

    on_focus_under_fullscreen = 1 # if there is a fullscreen or maximized window, decide whether a tiled window requested to focus should replace it, stay behind or disable the fullscreen/maximized state. 0 - ignore focus request (keep focus on fullscreen window), 1 - takes over, 2 - unfullscreen/unmaximize [0/1/2]

    focus_on_activate = true
}
