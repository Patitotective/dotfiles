# See https://wiki.hyprland.org/Configuring/Binds/ and https://wiki.hyprland.org/Configuring/Keywords/
#
# Flags
# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# c -> click, will trigger on release of a key or button as long as the mouse cursor stays inside input:drag_threshold.
# g -> drag, will trigger on release of a key or button as long as the mouse cursor moves outside input:drag_threshold.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.
# u -> submap universal, will be active no matter the submap
#
# Letters that haven't been binded: u, a, z, v, x, q, o
# Letters that have been binded: W, S, H, L, P, R, G, N, X, Q, B, E, T, F
#
# wev = see key names
source = ~/.config/hypr/core/common.conf

binds {
    hide_special_on_workspace_change = true
    # allow_workspace_cycles = true # This is not what I want (firefox behavior of cycling through tabs)
    workspace_center_on = 1
    movefocus_cycles_fullscreen = true
    scroll_event_delay = 0
    focus_preferred_method = 0
}

################## VARIABLES ##################
$mainmod = super_l # Windows key

$appmenu = ~/.config/hypr/scripts/appmenu.fish # app launcher/runner
$powermenu = ~/.config/hypr/scripts/wlogout/powermenu.sh

$emojipicker = pkill fuzzel || bemoji --noline --clip
# --noline -> to prevent a new line at the end
# --clip -> to copy the emoji as well

# $colorpicker = pkill hyprpicker || hyprpicker --autocopy --format=hex
# $coloreditor = $launchprefix kitty --single-instance --class=termpicker --override confirm_os_window_close=0 termpicker
$colorpicker = $launchPrefix fish -c 'kcolorchooser --color (wl-paste) --print | wl-copy --trim-newline'
$clipboard = $launchprefix kitty --single-instance --class=clipse --override confirm_os_window_close=0 clipse
$terminal = $launchprefix kitty --single-instance
$filemanagerRaw = YAZI_RESTORE=1 $launchprefix kitty --single-instance --class=yazi --override confirm_os_window_close=0 -- yazi
$filemanager = ~/.config/hypr/scripts/focusOrLaunch.fish -c yazi -l "$filemanagerRaw"
$browserRaw = $launchprefix zen-browser
$browser = ~/.config/hypr/scripts/focusOrLaunch.fish -c zen -l "$browserRaw"
# $musicRaw = $launchprefix spotify
# $musicRaw = $launchprefix kitty --single-instance --class=spotify_player --override confirm_os_window_close=0 spotify_player
# $musicRaw = $launchprefix env 'WINEPREFIX=/home/cristobal/.wine' wine 'C:\\\\users\\\\cristobal\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\iTunes\\\\iTunes.lnk'
$musicRaw = $launchprefix zen-browser --new-window https://music.youtube.com/
$music = ~/.config/hypr/scripts/focusOrLaunch.fish -e "YouTube Music — Zen Browser" -l "$musicRaw"
$mail = ~/.config/hypr/scripts/focusOrLaunch.fish -c aerc -l "$launchprefix kitty --single-instance --class=aerc --override confirm_os_window_close=0 aerc"
$calculator = ~/.config/hypr/scripts/focusOrLaunch.fish -c org.kde.kalk -l "$launchprefix kalk"
$wifi = networkmanager_dmenu
$calendar = ~/.config/hypr/scripts/focusOrLaunch.fish -c khal -l "$launchprefix kitty --single-instance --class=khal --override confirm_os_window_close=0 ikhal"
$traymenu = ~/.config/hypr/scripts/focusOrLaunch.fish -c tray-tui -l "$launchprefix kitty --single-instance --class=tray-tui --override confirm_os_window_close=0 tray-tui"

################## BINDS INHIBITOR ##################
bind = $mainmod, backspace, submap, binds-inhibited
submap = binds-inhibited
bind = $mainmod, backspace, submap, reset
submap = reset

################## APPLICATIONS ##################
bind = $mainmod, t, exec, $terminal
bind = $mainmod, e, exec, $filemanager
bind = $mainmod shift, e, exec, $filemanagerRaw
bind = $mainmod, b, exec, $browser
bind = $mainmod shift, b, exec, $browserRaw
bind = $mainmod, c, exec, $calendar
bind = $mainmod, m, exec, $mail
bind = $mainmod shift, c, exec, $colorpicker
# bind = $mainmod, xf86audioplay, exec, $music
bind = $mainmod, xf86audioplay, sendshortcut, alt, 5, class:zen
bind = $mainmod, xf86audioplay, focuswindow, class:zen
bind = , xf86tools, exec, $music
bind = $mainmod, F11, exec, $calculator

bind = $mainmod, n, exec, ~/.config/hypr/scripts/nvim-everywhere.fish

################## MENUS ##################
# bindl = $mainmod, escape, exec, $powermenu # I end up pressing this on accident
bindl = $mainmod, Pause, exec, $powermenu
bind = $mainmod, space, exec, $appmenu
bind = $mainmod, period, exec, $emojipicker
bind = $mainmod, bar, exec, $clipboard # bar=|
bindl = , xf86poweroff, exec, $powermenu

################## SYSTEM TRAY MENU? ##################
bind = $mainmod shift, t, exec, $traymenu

bind = $mainmod, ntilde, submap, connect-menu # ñ
submap = connect-menu, reset

# bind = shift, b, exec, $bluetooth
bind = , b, exec, ~/.config/hypr/scripts/bluetooth.fish
bind = , w, exec, $wifi
bind = , catchall, submap, reset

submap = reset

################## KEYBOARD STATE INDICATORS ##################
# note that without the r flag, waybar would be updated before the actual toggle happens and it wouldn't work
binditnlru = , caps_lock, exec, kill -SIGRTMIN+3 $(pgrep waybar)
binditnlru = , num_lock, exec, kill -SIGRTMIN+4 $(pgrep waybar)
#
################## TOUCHPAD STATE INDICATORS ##################
binditnlu = , xf86touchpadon, exec, ~/.config/waybar/scripts/touchpad_status.fish on
binditnlu = , xf86touchpadoff, exec, ~/.config/waybar/scripts/touchpad_status.fish off

################## NOTIFICATIONS ##################
bind = $mainmod shift, n, submap, notifications
submap = notifications
bind = , d, exec, dunstctl close

bind = shift, d, exec, dunstctl close-all
bind = shift, d, submap, reset

bind = , p, exec, dunstctl history-pop

bind = , l, exec, dunstctl action
bind = , l, submap, reset

# printf %s removes the trailing newline
bind = , y, exec, printf %s $(cat $HOME/.config/dunst/body.tmp) | wl-copy
bind = , y, submap, reset

bindr = , catchall, submap, reset
submap = reset

################## SCREENSHOTS ##################
$screenshotcmd = grimblast --notify --openparentdir copysave

bindl = , print, exec, $screenshotcmd screen  # whole screen
bindl = $mainmod, print, exec, $screenshotcmd active # active window
bindl = shift, print, exec, $screenshotcmd area # select

################## LAYOUT ##################
bind = $mainmod shift, p, layoutmsg, togglesplit

bind = $mainmod, y, exec, ~/.config/hypr/scripts/toggleLayout.fish

# bind = $mainmod shift, mouse_down, exec, layoutmsg, move +200
# bind = $mainmod shift, mouse_up, exec, layoutmsg, move -200

################## SOUND ##################
$soundstep = 0.05 # 5%
$soundbigstep = 0.2 # 20%
$soundsmallstep = 0.01 # 1%

$soundup = ~/.config/hypr/scripts/audiocontrol.fish +$soundstep
$sounddown = ~/.config/hypr/scripts/audiocontrol.fish -$soundstep

$soundbigup = ~/.config/hypr/scripts/audiocontrol.fish +$soundbigstep
$soundbigdown = ~/.config/hypr/scripts/audiocontrol.fish -$soundbigstep

$soundsmallup = ~/.config/hypr/scripts/audiocontrol.fish +$soundsmallstep
$soundsmalldown = ~/.config/hypr/scripts/audiocontrol.fish -$soundsmallstep

bindel = , xf86audioraisevolume, exec, $soundup
bindel = , xf86audiolowervolume, exec, $sounddown
bindel = shift, xf86audioraisevolume, exec, $soundbigup
bindel = shift, xf86audiolowervolume, exec, $soundbigdown
bindel = ctrl, xf86audioraisevolume, exec, $soundsmallup
bindel = ctrl, xf86audiolowervolume, exec, $soundsmalldown

bindel = $mainmod, up, exec, $soundup
bindel = $mainmod, down, exec, $sounddown
bindel = $mainmod shift, up, exec, $soundbigup
bindel = $mainmod shift, down, exec, $soundbigdown
bindel = $mainmod ctrl, up, exec, $soundsmallup
bindel = $mainmod ctrl, down, exec, $soundsmalldown

bindel = , xf86audiomute, exec, ~/.config/hypr/scripts/audiocontrol.fish toggle

bindel = , xf86audiomicmute, exec, ~/.config/hypr/scripts/miccontrol.fish toggle

################## BRIGHTNESS ##################
$brightnessbigstep = 20%
$brightnessstep = 5%
$brightnesssmallstep = 1%

$brightnessup = brightnessctl s +$brightnessstep
$brightnessdown = brightnessctl s $brightnessstep-

$brightnessbigup = brightnessctl s +$brightnessbigstep
$brightnessbigdown = brightnessctl s $brightnessbigstep-

$brightnesssmallup = brightnessctl s +$brightnesssmallstep
$brightnesssmalldown = brightnessctl s $brightnesssmallstep-

bindel = , xf86monbrightnessdown, exec, $brightnessdown
bindel = , xf86monbrightnessup, exec, $brightnessup
bindel = shift, xf86monbrightnessdown, exec, $brightnessbigdown
bindel = shift, xf86monbrightnessup, exec, $brightnessbigup
bindel = ctrl, xf86monbrightnessdown, exec, $brightnesssmalldown
bindel = ctrl, xf86monbrightnessup, exec, $brightnesssmallup

bindel = $mainmod, left, exec, $brightnessdown
bindel = $mainmod, right, exec, $brightnessup
bindel = $mainmod shift, left, exec, $brightnessbigdown
bindel = $mainmod shift, right, exec, $brightnessbigup
bindel = $mainmod ctrl, left, exec, $brightnesssmalldown
bindel = $mainmod ctrl, right, exec, $brightnesssmallup

################## PLAYER CONTROL ##################
bindl = , xf86audionext, exec, ~/.config/hypr/scripts/playNext.fish
bindl = , xf86audioprev, exec, ~/.config/hypr/scripts/playPrev.fish
bindl = , xf86audiopause, exec, ~/.config/hypr/scripts/playPause.fish
bindl = , xf86audioplay, exec, ~/.config/hypr/scripts/playPause.fish

# bindl = shift, xf86audiopause, exec, playerctl play-pause
# bindl = shift, xf86audioplay, exec, playerctl play-pause
# bindl = shift, xf86audionext, exec, playerctl next
# bindl = shift, xf86audioprev, exec, playerctl previous

################## LAPTOP LID ##################
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/on_events/onLidClose.fish
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/on_events/onLidOpen.fish

################## ZOOM ##################
bind = $mainmod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
bind = $mainmod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

# NOTE: Doesn't really work but you can just zoom out...
binde = $mainmod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor 1)

binde = $mainmod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
binde = $mainmod, kp_subtract, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

binde = $mainmod, plus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = $mainmod, kp_add, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')

################## HYPR ##################
bind = $mainmod ctrl, escape, exec, killall waybar || waybar # Toggle waybar

bind = $mainmod shift, x, exec, ~/.config/hypr/scripts/toggleEffects.sh

# bind = $mainmod, m, exec, ~/.config/hypr/scripts/onExit.sh && uwsm stop # Exit hyprland

bindl = $mainmod shift, r, exec, hyprctl reload

bindl = $mainmod, f5, exec, $hyprnim monitors --all
# bindl = $mainmod, f6, exec, $hyprnim monitors --disableEnable
bindl = $mainmod, f6, exec, $hyprnim monitors

bindn = , mouse:273, exec, ~/.config/hypr/scripts/desktopRightClick.fish

bindl = $mainmod, apostrophe, exec, ~/.config/hypr/scripts/cycleShaders.fish
bindl = $mainmod shift, apostrophe, exec, ~/.config/hypr/scripts/cycleShaders.fish -1

bind = $mainmod, i, exec, ~/.config/hypr/scripts/toggleIdleInhibit.fish

################## GROUPS ##################
bind = $mainmod ctrl, l, changegroupactive,
bind = $mainmod ctrl, h, changegroupactive, b

bind = $mainmod shift, g, togglegroup

bind = $mainmod, g, exec, ~/.config/hypr/scripts/enablegroup.fish
bind = $mainmod, g, submap, group
submap = group

bind = , g, togglegroup
bind = , c, lockactivegroup, toggle

bind = shift, l, movewindoworgroup, r
bind = shift, h, movewindoworgroup, l
bind = shift, j, movewindoworgroup, d
bind = shift, k, movewindoworgroup, u

bind = , h, movefocus, l
bind = , l, movefocus, r
bind = , k, movefocus, u
bind = , j, movefocus, d

bind = , h, exec, ~/.config/hypr/scripts/enablegroup.fish
bind = , l, exec, ~/.config/hypr/scripts/enablegroup.fish
bind = , k, exec, ~/.config/hypr/scripts/enablegroup.fish
bind = , j, exec, ~/.config/hypr/scripts/enablegroup.fish

bind = ctrl, h, movewindow, l
bind = ctrl, j, movewindow, d
bind = ctrl, k, movewindow, u
bind = ctrl, l, movewindow, r

bindr = , catchall, submap, reset
submap = reset

################## WINDOWS ##################
bind = $mainmod shift, q, forcekillactive
bind = $mainmod, d, killactive, # Close current window

# bind = $mainmod ctrl, h, swapnext, prev
# bind = $mainmod ctrl, l, swapnext
bind = $mainmod, p, swapnext
# TODO: make y cycle between layouts

bind = alt, tab, focuscurrentorlast

bind = $mainmod, f, exec, ~/.config/hypr/scripts/cycleNext.fish
bind = $mainmod shift, f, exec, ~/.config/hypr/scripts/cycleNext.fish prev

bind = $mainmod, h, movefocus, l
bind = $mainmod, l, movefocus, r
bind = $mainmod, k, movefocus, u
bind = $mainmod, j, movefocus, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainmod, mouse:272, movewindow
bindm = $mainmod, mouse:273, resizewindow

bind = $mainmod, w, togglefloating
bind = $mainmod shift, w, pseudo, # dwindle

# bind = $mainmod, f, fullscreen
bind = , f11, fullscreen

# bind = $mainmod, backspace, toggleswallow

################## WINDOW RESIZE ##################
$resizestep = 99 # 1920 / 20
$resizebigstep = 220 # 1980 / 8
$resizesmallstep = 10 # 1980 / 198

bind = $mainmod, r, submap, resize
submap = resize

bind = , h, resizeactive, -$resizestep 0
bind = , l, resizeactive, $resizestep 0
bind = , j, resizeactive, 0 -$resizestep
bind = , k, resizeactive, 0 $resizestep

bind = shift, h, resizeactive, -$resizebigstep 0
bind = shift, l, resizeactive, $resizebigstep 0
bind = shift, j, resizeactive, 0 -$resizebigstep
bind = shift, k, resizeactive, 0 $resizebigstep

bind = ctrl, h, resizeactive, -$resizesmallstep 0
bind = ctrl, l, resizeactive, $resizesmallstep 0
bind = ctrl, j, resizeactive, 0 -$resizesmallstep
bind = ctrl, k, resizeactive, 0 $resizesmallstep

bindr = , catchall, submap, reset
submap = reset

################## WORKSPACES ##################
bind = $mainmod, s, togglespecialworkspace
bind = , xf86presentation, togglespecialworkspace # Cause why not...
bind = $mainmod shift, s, movetoworkspace, special

bind = $mainmod, tab, exec, ~/.config/hypr/scripts/switchWorkspace.sh prev hist

bind = $mainmod shift, h, exec, ~/.config/hypr/scripts/switchWorkspace.sh e-1
bind = $mainmod shift, l, exec, ~/.config/hypr/scripts/switchWorkspace.sh e+1
bind = $mainmod shift, j, exec, ~/.config/hypr/scripts/switchWorkspace.sh -10
bind = $mainmod shift, k, exec, ~/.config/hypr/scripts/switchWorkspace.sh +10

bind = $mainmod, 1, workspace, 1
bind = $mainmod, 2, workspace, 2
bind = $mainmod, 3, workspace, 3
bind = $mainmod, 4, workspace, 4
bind = $mainmod, 5, workspace, 5
bind = $mainmod, 6, workspace, 6
bind = $mainmod, 7, workspace, 7
bind = $mainmod, 8, workspace, 8
bind = $mainmod, 9, workspace, 9
bind = $mainmod, 0, workspace, 10

bind = $mainmod, braceleft, movetoworkspace, -1
bind = $mainmod, braceright, movetoworkspace, +1
# bind = $mainmod shift, braceleft, movetoworkspace, -10
# bind = $mainmod shift, braceright, movetoworkspace, +10
# TODO: make '$maindmod ctrl, braceleft work' and add bindings to move workspace to a specific id
bind = $mainmod shift, braceleft, exec, ~/.config/hypr/scripts/swapWorkspace.fish -1
bind = $mainmod shift, braceright, exec, ~/.config/hypr/scripts/swapWorkspace.fish +1

bind = $mainmod shift, 1, movetoworkspace, 1
bind = $mainmod shift, 2, movetoworkspace, 2
bind = $mainmod shift, 3, movetoworkspace, 3
bind = $mainmod shift, 4, movetoworkspace, 4
bind = $mainmod shift, 5, movetoworkspace, 5
bind = $mainmod shift, 6, movetoworkspace, 6
bind = $mainmod shift, 7, movetoworkspace, 7
bind = $mainmod shift, 8, movetoworkspace, 8
bind = $mainmod shift, 9, movetoworkspace, 9
bind = $mainmod shift, 0, movetoworkspace, 10

################## HYPREXPO ##################
