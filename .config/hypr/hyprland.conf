# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/plugins.conf
source = ~/.config/hypr/colors.conf

debug:disable_logs = false
# opengl:nvidia_anti_flicker = false # reduces flickering on nvidia at the cost of possible frame drops on lower-end GPUs. On non-nvidia, this is ignored.

cursor {
    inactive_timeout = 5
    # hide_on_key_press = true
    # For lagging mouse
    no_hardware_cursors = 1
    use_cpu_buffer = 0
}

binds {
    hide_special_on_workspace_change = true
    # allow_workspace_cycles = true
    workspace_center_on = 1
    movefocus_cycles_fullscreen = true
    scroll_event_delay = 0
}
# https://wiki.hyprland.org/Configuring/Environment-variables/
# They're in:
# ~/.config/uwsm/env
# ~/.config/uwsm/env-hyprland

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 20

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $color9 
    col.inactive_border = $color4
    resize_on_border = true # Set to true enable resizing windows by clicking and dragging on borders and gaps
    hover_icon_on_border = true

    allow_tearing = false # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on

    layout = dwindle
}

misc {
    disable_hyprland_logo = true # disables the random Hyprland logo / anime girl background. :(
    disable_splash_rendering = true # disables the Hyprland splash rendering.
    force_default_wallpaper = 0

    mouse_move_enables_dpms = true # If DPMS is set to off, wake up the monitors if the mouse moves.
    key_press_enables_dpms = true

    animate_manual_resizes = true

    vfr = true # lower the amount of sent frames when nothing is happening on-screen

    allow_session_lock_restore = true # if true, will allow you to restart a lockscreen app in case it crashes (red screen of death)

    close_special_on_empty = true # close the special workspace if the last window is removed

    new_window_takes_over_fullscreen = 1 # if there is a fullscreen or maximized window, decide whether a new tiled window opened should replace it, stay behind or disable the fullscreen/maximized state. 0 - behind, 1 - takes over, 2 - unfullscreen/unmaxize [0/1/2]
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    border_part_of_window = false

    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.5

    shadow {
        enabled = false
        range = 3
        render_power = 1

        color = $color12
        color_inactive = $color4
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true	
        size = 1
        passes = 1
        ignore_opacity = true
        new_optimizations = true
        special = true
        popups = true
    }
}

group {
    col.border_active = $color14
    col.border_locked_active = $color15
    col.border_inactive = $color4
    col.border_locked_inactive = $color4

	groupbar {
        enabled = false
        keep_upper_gap = false
        render_titles = false
		col.active = $color0
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    # special_scale_factor=0.85
}

# TODO: binding to switch to master
# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}
