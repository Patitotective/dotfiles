###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$resizeStep = 10%
$resizeBigStep = 30%
$brightnessStep = 0.1 # 10%
$brightnessUp = busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateBrightness d $brightnessStep
$brightnessDown = busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateBrightness d -$brightnessStep
$soundStep = 5%
$soundUp = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $soundStep+
$soundDown = wpctl set-volume @DEFAULT_AUDIO_SINK@ $soundStep-

$menu = pkill wofi || wofi --show drun
$clipboard = pkill clipse || kitty --class clipse -e clipse
$terminal = kitty
$fileManager = dolphin
$browser = floorp
$editor = nvim
$colorPicker = hyprpicker

bind = $mainMod, X, exec, ~/scripts/hypr/toggleEffects.sh

# See https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, space, exec, $menu

bind = $mainMod, D, killactive, # Close current window
bind = $mainMod, M, exec, ~/scripts/onExit.sh && uwsm stop # Exit hyprland
bind = $mainMod, W, togglefloating,
#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle

# Toggle waybar
bind = $mainMod Ctrl, Escape, exec, killall waybar || waybar

# Open clipboard history
windowrule = float, class:(clipse)
windowrule = size 622 652, class:(clipse)
windowrule = stayfocused, class:(clipse)

bind = $mainMod, V, exec, $clipboard

# Color picker
bind = $mainMod, P, exec, $colorPicker | xargs -r wl-copy

# Lock screen
# bind = $mainMod SHIFT, L, exec, hyprlock

# Logout menu
bind = $mainMod, ESCAPE, exec, wlogout

# Screenshots
# add --cursor flag to include cursor also, --freeze flag to freeze before selection

# Entire screen + clipboard copy
bind = , Print, exec, grimblast --notify copysave screen 

# current Active window only + clipboard copy
bind = $mainMod, Print, exec, grimblast --notify copysave active 

# Select area to take screenshot
bind = $mainMod ALT, Print, exec, grimblast --notify copysave area 

# Move focus with mainMod + arrow keys
# bind = $mainMod, left, movefocus, l
# bind = $mainMod, right, movefocus, r
# bind = $mainMod, up, movefocus, u
# bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic

bind = $mainMod SHIFT, S, movetoworkspace, special:magic
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $soundUp
bindel = ,XF86AudioLowerVolume, exec, $soundDown
bindel = $mainMod, down, exec, $soundDown
bindel = $mainMod, up, exec, $soundUp
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessDown, exec, $brightnessDown
bindel = ,XF86MonBrightnessUp, exec, $brightnessUp
bindel = $mainMod, left, exec, $brightnessDown
bindel = $mainMod, right, exec, $brightnessUp
bindl  = , XF86PowerOff, exec, wlogout

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# binds {
#     allow_workspace_cycles = yes
# }

bind = $mainMod, Tab, workspace, previous
bindl = , switch:on:Lid Switch, exec, ~/scripts/hypr/onLidClose.sh
bindl = , switch:off:Lid Switch, exec, ~/scripts/hypr/onLidOpen.sh

bind = $mainMod, SUPER_L, submap, window
submap = window
bind = , escape, submap, reset

bind = , d, killactive
bind = , d, submap, reset

bind = , t, exec, $terminal
bind = , t, submap, reset

bind = , e, exec, $fileManager
bind = , e, submap, reset

bind = , b, exec, $browser
bind = , b, submap, reset

bind = , space, exec, $menu
bind = , space, submap, reset

# Switch workspaces with mainMod + [0-9]
bind = , 1, workspace, 1
bind = , 1, submap, reset

bind = , 2, workspace, 2
bind = , 2, submap, reset

bind = , 3, workspace, 3
bind = , 3, submap, reset

bind = , 4, workspace, 4
bind = , 4, submap, reset

bind = , 5, workspace, 5
bind = , 5, submap, reset

bind = , 6, workspace, 6
bind = , 6, submap, reset

bind = , 7, workspace, 7
bind = , 7, submap, reset

bind = , 8, workspace, 8
bind = , 8, submap, reset

bind = , 9, workspace, 9
bind = , 9, submap, reset

bind = , 0, workspace, 10
bind = , 0, submap, reset


bind = , r, submap, window_resize
submap = window_resize
bind = , escape, submap, reset

bindm = , mouse:272, resizewindow
bind = , h, resizeactive, -$resizeStep 0
bind = , j, resizeactive, 0 $resizeStep
bind = , k, resizeactive, 0 -$resizeStep
bind = , l, resizeactive, $resizeStep 0
# bind = SHIFT_L, h, resizeactive, -$resizeBigStep 0
# bind = SHIFT_L, j, resizeactive, 0 $resizeBigStep
# bind = SHIFT_L, k, resizeactive, 0 -$resizeBigStep
# bind = SHIFT_L, l, resizeactive, $resizeBigStep 0

bind = , catchall, submap, reset
submap = window

bind = , catchall, submap, reset
submap = reset

bind = SUPER_SHIFT, SUPER_L, submap, window_move
submap = window_move
bind = , escape, submap, reset

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = , 1, movetoworkspace, 1
bind = , 2, movetoworkspace, 2
bind = , 3, movetoworkspace, 3
bind = , 4, movetoworkspace, 4
bind = , 5, movetoworkspace, 5
bind = , 6, movetoworkspace, 6
bind = , 7, movetoworkspace, 7
bind = , 8, movetoworkspace, 8
bind = , 9, movetoworkspace, 9
bind = , 0, movetoworkspace, 10

bind = , catchall, submap, reset
submap = reset
