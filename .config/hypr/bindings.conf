###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Binds/ for more
# See https://wiki.hyprland.org/Configuring/Keywords/
# Flags
# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# c -> click, will trigger on release of a key or button as long as the mouse cursor stays inside input:drag_threshold.
# g -> drag, will trigger on release of a key or button as long as the mouse cursor moves outside input:drag_threshold.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.

# Variables
$mainMod = SUPER_L # Sets "Windows" key as main modifier

$resizeStep = 10%
$resizeBigStep = 30%
$brightnessStep = 0.1 # 10%
$brightnessUp = ~/scripts/hypr/setBrightness.sh +$brightnessStep
$brightnessDown = ~/scripts/hypr/setBrightness.sh -$brightnessStep
$soundStep = 5%
$soundUp = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $soundStep+
$soundDown = wpctl set-volume @DEFAULT_AUDIO_SINK@ $soundStep-

$launchPrefix = app2unit --
$menu = pkill fuzzel || fuzzel
$clipboard = pkill fuzzel || cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy
$terminal = $launchPrefix kitty
$fileManager = $launchPrefix dolphin
$browser = $launchPrefix floorp
$editor = $launchPrefix nvim
$colorPicker = hyprpicker --autocopy --format=hex

# Applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, bar, exec, $clipboard # Clipboard picker (bar=|)
bind = $mainMod, C, exec, $colorPicker # Color picker
bind = $mainMod, ESCAPE, exec, wlogout # Logout menu
bind = $mainMod, space, exec, $menu
# bind $mainMod, F11, exec, calculator # Calculator

bind = , Print, exec, grimblast --notify copysave screen  # Screenshot entire screen + clipboard copy
bind = $mainMod, Print, exec, grimblast --notify copysave active # Screenshot current Active window only + clipboard copy
bind = ALT, Print, exec, grimblast --notify copysave area # Select area to take screenshot

bind = $mainMod Ctrl, Escape, exec, killall waybar || waybar # Toggle waybar

bind = $mainMod, x, exec, ~/scripts/hypr/toggleEffects.sh
bind = $mainMod, M, exec, ~/scripts/hypr/onExit.sh && uwsm stop # Exit hyprland
bindl = $mainMod, R, exec, hyprctl reload

# Window management
bind = $mainMod, Q, exec, hyprctl kill
bind = $mainMod, D, killactive, # Close current window
bind = $mainMod SHIFT, w, togglefloating,
bind = $mainMod, p, togglesplit, 
bind = $mainMod SHIFT, P, pseudo, # dwindle
bind = $mainMod, s, togglespecialworkspace, magic
bind = $mainMod SHIFT, s, movetoworkspace, special:magic
bind = $mainMod, f, fullscreen
bind = , F11, fullscreen

bind = $mainMod CTRL, h, swapnext, prev
bind = $mainMod CTRL, l, swapnext

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, Tab, exec, ~/scripts/hypr/switchWorkspace.sh e+1
bind = $mainMod SHIFT, Tab, exec, ~/scripts/hypr/switchWorkspace.sh e-1
# bind = $mainMod, Tab, workspace, e+1
# bind = $mainMod, n, workspace, previous
bind = $mainMod, g, togglegroup,
bind = $mainMod CTRL, tab, changegroupactive,

# bind = $mainMod SHIFT, H, workspace, e-1
# bind = $mainMod SHIFT, L, workspace, e+1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, h, movetoworkspace, -1
bind = $mainMod SHIFT, l, movetoworkspace, +1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# bind = $mainMod, h, resizeactive, -$resizeStep 0
# bind = $mainMod, j, resizeactive, 0 $resizeStep
# bind = $mainMod, k, resizeactive, 0 -$resizeStep
# bind = $mainMod, l, resizeactive, $resizeStep 0
# bind = SHIFT_L, h, resizeactive, -$resizeBigStep 0
# bind = SHIFT_L, j, resizeactive, 0 $resizeBigStep
# bind = SHIFT_L, k, resizeactive, 0 -$resizeBigStep
# bind = SHIFT_L, l, resizeactive, $resizeBigStep 0

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $soundUp
bindel = ,XF86AudioLowerVolume, exec, $soundDown
bindel = $mainMod, down, exec, $soundDown
bindel = $mainMod, up, exec, $soundUp
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessDown, exec, $brightnessDown
bindel = ,XF86MonBrightnessUp, exec, $brightnessUp
bindel = $mainMod, left, exec, $brightnessDown
bindel = $mainMod, right, exec, $brightnessUp
bindl = , XF86PowerOff, exec, wlogout

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# binds {
#     allow_workspace_cycles = yes
# }

# bind = ALT, Tab, exec, hyprswitch simple --sort-recent
bindl = , switch:on:Lid Switch, exec, ~/scripts/hypr/onLidClose.sh
bindl = , switch:off:Lid Switch, exec, ~/scripts/hypr/onLidOpen.sh

bind = $mainMod, $mainMod, submap, window
submap = window
bind = , escape, submap, reset


bind = , t, exec, $terminal
bind = , e, exec, $fileManager
bind = , b, exec, $browser
bind = , space, exec, $menu

bind = , d, killactive
bind = , Q, exec, hyprctl kill
bind = SHIFT, w, togglefloating,
bind = , p, togglesplit, 
bind = SHIFT, P, pseudo, # dwindle
bind = , s, togglespecialworkspace, magic
bind = SHIFT, s, movetoworkspace, special:magic
bind = , f, fullscreen

bind = CTRL, h, swapnext, prev
bind = CTRL, l, swapnext

bind = , Tab, exec, ~/scripts/hypr/switchWorkspace.sh e+1
bind = SHIFT, Tab, exec, ~/scripts/hypr/switchWorkspace.sh e-1

bind = , g, togglegroup,
bind = CTRL, tab, changegroupactive,

bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9
bind = , 0, workspace, 10

bind = , h, movefocus, l
bind = , j, movefocus, r
bind = , k, movefocus, u
bind = , l, movefocus, d

bind = SHIFT, h, resizeactive, -$resizeStep 0
bind = SHIFT, j, resizeactive, 0 $resizeStep
bind = SHIFT, k, resizeactive, 0 -$resizeStep
bind = SHIFT, l, resizeactive, $resizeStep 0

bind = SHIFT, 1, movetoworkspace, 1
bind = SHIFT, 2, movetoworkspace, 2
bind = SHIFT, 3, movetoworkspace, 3
bind = SHIFT, 4, movetoworkspace, 4
bind = SHIFT, 5, movetoworkspace, 5
bind = SHIFT, 6, movetoworkspace, 6
bind = SHIFT, 7, movetoworkspace, 7
bind = SHIFT, 8, movetoworkspace, 8
bind = SHIFT, 9, movetoworkspace, 9
bind = SHIFT, 0, movetoworkspace, 10

bind = , catchall, submap, reset
submap = reset
