# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 9
    font_family = JetBrains Mono Nerd Font Mono Italic
    position = 0, 230
    halign = center
    valign = bottom
    zindex = 5
}
# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 210
    halign = center
    valign = bottom
    zindex = 5
}

