theme = "dracula"
client_id = "5c33772cc7e9464a88bdac9d2590c3ef"
client_port = 8080
login_redirect_uri = "http://127.0.0.1:8989/login"
playback_format = """
{status} {track} • {artists}
{album}
{metadata}"""
tracks_playback_limit = 50
app_refresh_duration_in_ms = 32
playback_refresh_duration_in_ms = 0
page_size_in_rows = 20
# It feels more natural to me if they're inversed
play_icon = ""
pause_icon = ""
liked_icon = ""
border_type = "Rounded"
progress_bar_type = "Rectangle"
# cover_img_width = 10
# cover_img_length = 24
cover_img_width = 5
cover_img_length = 12
enable_cover_image_cache = true
default_device = "spotify-player"
seek_duration_secs = 5
sort_artist_albums_by_type = false

[layout]
playback_window_position = "Top"
playback_window_height = 6

[layout.library]
playlist_percent = 40
album_percent = 40

[device]
name = "spotify-player"
device_type = "speaker"
volume = 100
bitrate = 320
audio_cache = false
normalization = true
autoplay = true
