[manager]
# sort_by = "natural"
# sort_sensitive = true
# sort_dir_first = true
# sort_translit = true
linemode = "size"
show_symlink = true
scrolloff = 10

[preview]
wrap = "no"
tab_size = 2
image_delay = 10
max_width = 2000
max_height = 2000

[opener]
show = [{ run = "gwenview $@", orphan = true, for = "unix" }]
pdf = [{ run = "okular $@", orphan = true, for = "unix" }]
play = [{ run = "gwenview $@", orphan = true, for = "unix" }]
extract = [
  { run = 'ouch d -y "%*"', desc = "Extract here with ouch", for = "windows" },
  { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]
[open]
prepend_rules = [
  { mime = "image/*", use = "show" },
  { mime = "application/pdf", use = "pdf" },
]

[plugin]
prepend_previewers = [
  # Archive previewer
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/x-tar", run = "ouch" },
  { mime = "application/x-bzip2", run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar", run = "ouch" },
  { mime = "application/x-xz", run = "ouch" },
  { mime = "application/xz", run = "ouch" },
]
append_previewers = [{ name = "*", run = "file" }]
prepend_spotters = [{ name = "*", run = "file-extra-metadata" }]
