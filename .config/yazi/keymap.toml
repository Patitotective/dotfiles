[confirm]
keymap = [
  { on = "<esc>", run = "close" },
  { on = "q", run = "close" },
  { on = "n", run = "close" },
  { on = "y", run = "close --submit" },
  { on = "d", run = "close --submit" },  # so you can delete files with dd
  { on = "<enter>", run = "close --submit" },
  { on = "<c-p>", run = "arrow -1" },
  { on = "<c-n>", run = "arrow 1" },
  { on = ["g", "?"], run = "help" },
]

[cmp]
