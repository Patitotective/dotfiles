#################### tab_switch ####################

[[manager.prepend_keymap]]
on = "L"
run = "tab_switch 1 --relative"

[[manager.prepend_keymap]]
on = "H"
run = "tab_switch -1 --relative"

#################### ouch ####################

[[manager.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

#################### chmod ####################

[[manager.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[manager.prepend_keymap]]
on = ["g", "i"]
run = "plugin lazygit"
desc = "run lazygit"

#################### restore ####################

[[manager.prepend_keymap]]
on = "u"
run = "plugin restore"
desc = "Restore last deleted files/folders"

#################### kdeconnect-send ####################
#
[[manager.prepend_keymap]]
on = ["<C-s>"]
run = "plugin kdeconnect-send"
desc = "Send selected files via KDE Connect"

#################### mount ####################

[[manager.prepend_keymap]]
on = "M"
run = "plugin mount"

#################### toggle/select ####################

[[manager.prepend_keymap]]
on = "K"
run = ["toggle", "arrow prev"]
desc = "Toggle the current selection state and go up"

[[manager.prepend_keymap]]
on = "J"
run = ["toggle", "arrow next"]
desc = "Toggle the current selection state and go down"

