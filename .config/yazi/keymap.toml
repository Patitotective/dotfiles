  { on = "<c-e>", run = "close" },
  { on = "<c-y>", run = "close --submit" },
  { on = "<c-p>", run = "arrow -1" },
  { on = "<c-n>", run = "arrow 1" },
  { on = ["g", "?"], run = "help" },
]

[help]
