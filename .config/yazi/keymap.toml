# To be able to delete with dd
[[confirm.prepend_keymap]]
on = ["d"]
run = "close --submit"

# To copy the path of the file on y
[[mgr.prepend_keymap]]
on = "y"
run = [
  'shell -- for path in "$@"; do echo -n "$path "; done | wl-copy -t text/uri-list',
  "yank",
]

[[mgr.prepend_keymap]]
on = "<esc>"
run = "escape --all"

#################### dragon (drag and) drop ####################
[[mgr.prepend_keymap]]
on = "<C-n>"
run = 'shell -- dragon-drop --and-exit --icon-only --on-top --all "$@"'

#################### file-extra-metadata ####################
[[mgr.prepend_keymap]]
on = "<tab>"
run = "spot"
desc = "Spot hovered file"

#################### bookmarks ####################

[[mgr.prepend_keymap]]
on = ["m"]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = ["'"]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = ["b", "d"]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = ["b", "D"]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

#################### tab_switch ####################

[[mgr.prepend_keymap]]
on = "L"
run = "tab_switch 1 --relative"

[[mgr.prepend_keymap]]
on = "H"
run = "tab_switch -1 --relative"

#################### ouch ####################

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

#################### chmod ####################

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = ["g", "i"]
run = "plugin lazygit"
desc = "run lazygit"

#################### restore ####################

[[mgr.prepend_keymap]]
on = "u"
run = "plugin restore"
desc = "Restore last deleted files/folders"

#################### kdeconnect-send ####################
#
[[mgr.prepend_keymap]]
on = ["<C-s>"]
run = "plugin kdeconnect-send"
desc = "Send selected files via KDE Connect"

#################### mount ####################

# [[mgr.prepend_keymap]]
# on = "M"
# run = "plugin mount"

# [[mgr.prepend_keymap]]
# desc = "Select device then mount"
# on = ["M", "m"]
# run = "plugin gvfs -- select-then-mount"

[[mgr.prepend_keymap]]
desc = "Select device to mount and jump to its mount point"
on = ["M", "m"]
run = "plugin gvfs -- select-then-mount --jump"

[[mgr.prepend_keymap]]
desc = "Remount device under cwd"
on = ["M", "R"]
run = "plugin gvfs -- remount-current-cwd-device"

# [[mgr.prepend_keymap]]
# desc = "Select device then unmount"
# on = ["M", "u"]
# run = "plugin gvfs -- select-then-unmount"

[[mgr.prepend_keymap]]
desc = "Select device then eject"
on = ["M", "u"]
run = "plugin gvfs -- select-then-unmount --eject"

[[mgr.prepend_keymap]]
desc = "Select device then force to eject/unmount"
on = ["M", "U"]
run = "plugin gvfs -- select-then-unmount --eject --force"

[[mgr.prepend_keymap]]
desc = "Add a GVFS mount URI"
on = ["M", "a"]
run = "plugin gvfs -- add-mount"

[[mgr.prepend_keymap]]
desc = "Edit a GVFS mount URI"
on = ["M", "e"]
run = "plugin gvfs -- edit-mount"

[[mgr.prepend_keymap]]
desc = "Remove a GVFS mount URI"
on = ["M", "r"]
run = "plugin gvfs -- remove-mount"

[[mgr.prepend_keymap]]
desc = "Select device then jump to its mount point"
on = ["g", "m"]
run = "plugin gvfs -- jump-to-device"

[[mgr.prepend_keymap]]
desc = "Jump back to the position before jumped to device"
on = ["`", "`"]
run = "plugin gvfs -- jump-back-prev-cwd"

#################### toggle/select ####################

[[mgr.prepend_keymap]]
on = "K"
run = ["toggle", "arrow prev"]
desc = "Toggle the current selection state and go up"

[[mgr.prepend_keymap]]
on = "J"
run = ["toggle", "arrow next"]
desc = "Toggle the current selection state and go down"

#################### smart-enter ####################

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

#################### preview ####################

[[mgr.prepend_keymap]]
on = ["T", "t"]
run = "plugin toggle-pane min-preview"
desc = "Hide or restore the preview pane"

[[mgr.prepend_keymap]]
on = ["T", "T"]
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

