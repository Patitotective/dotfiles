  { on = "<esc>", run = "close" },
  { on = "q", run = "close" },
  { on = "k", run = "arrow -1" },
  { on = "j", run = "arrow 1" },
  { on = "<C-u>", run = "arrow -50%", desc = "move cursor up half page" },
