[mgr]
keymap = [
  { on = "<esc>", run = ["escape --all", "unyank"] },
  { on = "q", run = "plugin projects quit" },  # save the current project and quit
  { on = "h", run = "leave" },
  { on = "l", run = "plugin smart-enter", desc = "enter the child directory, or open the file" },
  { on = "k", run = "arrow -1" },
  { on = "j", run = "arrow 1" },
  { on = "<C-u>", run = "arrow -50%", desc = "move cursor up half page" },
  { on = "<C-d>", run = "arrow 50%", desc = "move cursor down half page" },
  { on = "<C-b>", run = "arrow -100%", desc = "move cursor up one page" },
  { on = "<C-f>", run = "arrow 100%", desc = "move cursor down one page" },
  { on = ["g", "g"], run = "arrow top" },
  { on = "G", run = "arrow bot" },
  { on = "<enter>", run = "tasks:show", desc = "show task manager" },
  { on = "<c-b>", run = "seek -1" },  # Scroll the preview window
  { on = "<c-f>", run = "seek 1" },
  { on = "<tab>", run = "spot" },
  { on = ".", run = "hidden toggle" },
  { on = "d", run = "remove" },  # no need for dd, since to confirm you can also do d
  { on = "D", run = "remove --permanently" },
  { on = "o", run = "create" },
  { on = "r", run = "rename --cursor=start" },
  # selection/visual mode
  { on = "v", run = "toggle" },
  { on = "V", run = "visual_mode" },
  { on = "K", run = ["toggle", "arrow prev"], desc = "toggle the current selection state and go up" },
  { on = "J", run = ["toggle", "arrow next"], desc = "toggle the current selection state and go down" },
  # cut/yank/paste
  { on = "x", run = "yank --cut" },
  { on = ["y", "y"], run = "yank" },
  { on = ["y", "p"], run = "copy path" },
  { on = ["y", "d"], run = "copy dirname" },
  { on = ["y", "f"], run = "copy filename" },
  { on = ["y", "n"], run = "copy name_without_ext" },
  { on = "p", run = "paste" },
  # linemode
  { on = ["u", "l", "s"], run = "linemode size", desc = "show size" },
  { on = ["u", "l", "b"], run = "linemode rbtime", desc = "show creation time" },  # relative birth time, custom linemode defined in init.lua
  { on = ["u", "l", "m"], run = "linemode rmtime", desc = "show modified time" },  # relative modified time, custom linemode defined in init.lua
  { on = ["u", "l", "p"], run = "linemode permissions", desc = "show permissions" },
  { on = ["u", "l", "o"], run = "linemode owner", desc = "show owner" },
  # sorting
  { on = ["u", "d"], run = "sort --dir-first", desc = "show directories first" },
  { on = ["u", "D"], run = "sort --dir-first=no", desc = "don't show directories first" },
  { on = ["u", "s", "m"], run = "sort mtime --reverse=no", desc = "sort by modified time" },
  { on = ["u", "s", "b"], run = "sort btime --reverse=no", desc = "sort by creationg time" },
  { on = ["u", "s", "e"], run = "sort extension --reverse=no", desc = "sort by extension" },
  { on = ["u", "s", "a"], run = "sort alphabetical --reverse=no", desc = "sort by alphabetical" },
  { on = ["u", "s", "n"], run = "sort natural --reverse=no", desc = "sort by natural" },
  { on = ["u", "s", "s"], run = "sort size --reverse=no", desc = "sort by size" },
  { on = ["u", "s", "r"], run = "sort random --reverse=no", desc = "sort by random" },
  { on = ["u", "s", "M"], run = "sort mtime --reverse", desc = "sort by modified time (reverse)" },
  { on = ["u", "s", "B"], run = "sort btime --reverse", desc = "sort by creation time (reverse)" },
  { on = ["u", "s", "E"], run = "sort extension --reverse", desc = "sort by extension (reverse)" },
  { on = ["u", "s", "A"], run = "sort alphabetical --reverse", desc = "sort by alphabetical (reverse)" },
  { on = ["u", "s", "N"], run = "sort natural --reverse", desc = "sort by natural (reverse)" },
  { on = ["u", "s", "S"], run = "sort size --reverse", desc = "sort by size (reverse)" },
  { on = ["u", "s", "R"], run = "sort random --reverse", desc = "sort by random (reverse)" },
  # searching/filtering
  { on = "s", run = "plugin fzf" },
  { on = "S", run = "search --via=rga", desc = "search content" },
  { on = "f", run = "filter --smart", desc = "filter files" },
  { on = "/", run = "find --smart" },
  { on = "?", run = "find --previous --smart", desc = "find previous file" },
  { on = "n", run = "find_arrow" },
  { on = "N", run = "find_arrow --previous" },
  # go To
  { on = ["<space>"], run = "cd --interactive", desc = "jump interactively" },
  { on = ["g", "h"], run = "cd ~", desc = "go home" },
  { on = ["g", "t"], run = "cd ~/.local/share/Trash/files", desc = "go to trash" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "go to downloads" },
  { on = ["g", "s"], run = "cd ~/Sync", desc = "go to sync" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "go to .config" },
  { on = ["g", "C"], run = "cd ~/clones", desc = "go to clones" },
  { on = ["g", "D"], run = "cd ~/Documents", desc = "go to documents" },
  { on = ["g", "p"], run = "cd ~/Pictures", desc = "go to pictures" },
  { on = ["g", "v"], run = "cd ~/Videos", desc = "go to videos" },
  { on = ["g", "u"], run = "cd ~/Sync/spain/upv/", desc = "go to upv" },
  # tabs
  { on = ["t", "d"], run = "close" },
  { on = ["t", "n"], run = "tab_create --current" },
  { on = "L", run = "tab_switch 1 --relative" },
  { on = "H", run = "tab_switch -1 --relative" },
  { on = ["g", "?"], run = "help" },
  { on = "<C-d>", run = "shell -- dragon-drop --and-exit --icon-only --on-top --all \"$@\"" },  # dragon (drag and) drop
  { on = "<tab>", run = "spot", desc = "spot hovered file" },  # file-extra-metadata
  #
  # plugins
  #
  # bookmarks
  { on = ["m"], run = "plugin bookmarks save", desc = "save current position as a bookmark" },
  { on = ["'"], run = "plugin bookmarks jump", desc = "jump to a bookmark" },
  { on = ["b", "d"], run = "plugin bookmarks delete", desc = "delete a bookmark" },
  { on = ["b", "D"], run = "plugin bookmarks delete_all", desc = "delete all bookmarks" },
  # ouch (compression)
  { on = ["C"], run = "plugin ouch", desc = "compress with ouch" },
  # chmod
  { on = ["c", "m"], run = "plugin chmod", desc = "chmod on selected files" },
  { on = ["g", "i"], run = "plugin lazygit", desc = "run lazygit" },
  # restore
  { on = "u", run = "plugin restore", desc = "restore last deleted files/folders" },
  # kdeconnect-send
  { on = ["<C-k>"], run = "plugin kdeconnect-send", desc = "send selected files via kde connect" },
  # mount
  { on = ["M", "m"], run = "plugin gvfs -- select-then-mount --jump", desc = "select device to mount and jump to its mount point" },
  { on = ["M", "R"], run = "plugin gvfs -- remount-current-cwd-device", desc = "remount device under cwd" },
  { on = ["M", "u"], run = "plugin gvfs -- select-then-unmount --eject", desc = "select device then eject" },
  { on = ["M", "U"], run = "plugin gvfs -- select-then-unmount --eject --force", desc = "select device then force to eject/unmount" },
  { on = ["M", "a"], run = "plugin gvfs -- add-mount", desc = "add a gvfs mount uri" },
  { on = ["M", "e"], run = "plugin gvfs -- edit-mount", desc = "edit a gvfs mount uri" },
  { on = ["M", "r"], run = "plugin gvfs -- remove-mount", desc = "remove a gvfs mount uri" },
  { on = ["'", "'"], run = "plugin gvfs -- jump-back-prev-cwd", desc = "jump back to the position before jumped to device" },
  # preview
  { on = ["T", "t"], run = "plugin toggle-pane min-preview", desc = "hide or restore the preview pane" },
  { on = ["T", "T"], run = "plugin toggle-pane max-preview", desc = "maximize or restore the preview pane" },
  # relative-motions
  { on = ["1"], run = "plugin relative-motions 1", desc = "move in relative steps" },
  { on = ["2"], run = "plugin relative-motions 2", desc = "move in relative steps" },
  { on = ["3"], run = "plugin relative-motions 3", desc = "move in relative steps" },
  { on = ["4"], run = "plugin relative-motions 4", desc = "move in relative steps" },
  { on = ["5"], run = "plugin relative-motions 5", desc = "move in relative steps" },
  { on = ["6"], run = "plugin relative-motions 6", desc = "move in relative steps" },
  { on = ["7"], run = "plugin relative-motions 7", desc = "move in relative steps" },
  { on = ["8"], run = "plugin relative-motions 8", desc = "move in relative steps" },
  { on = ["9"], run = "plugin relative-motions 9", desc = "move in relative steps" },
]

[tasks]
keymap = [
  { on = "<esc>", run = "close" },
  { on = "q", run = "close" },
  { on = "<enter>", run = "close" },
  { on = "k", run = "arrow -1" },
  { on = "j", run = "arrow 1" },
  { on = "<C-u>", run = "arrow -50%", desc = "move cursor up half page" },
  { on = "<C-d>", run = "arrow 50%", desc = "move cursor down half page" },
  { on = "<C-b>", run = "arrow -100%", desc = "move cursor up one page" },
  { on = "<C-f>", run = "arrow 100%", desc = "move cursor down one page" },
  { on = "l", run = "inspect", desc = "inspect the task" },
  { on = "d", run = "cancel", desc = "cancel the task" },
  { on = ["g", "?"], run = "help" },
]

[spot]
