# To be able to delete with dd
[[confirm.prepend_keymap]]
on = ["d"]
run = "close --submit"

# TO copy the path of the file on y
[[manager.prepend_keymap]]
on = "y"
run = [
  'shell -- for path in "$@"; do echo -n "$path "; done | wl-copy -t text/uri-list',
  "yank",
]

[[manager.prepend_keymap]]
on = "<esc>"
run = "escape --all"

