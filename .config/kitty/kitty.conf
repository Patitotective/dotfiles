include ./themes/carbonfox.conf

kitty_mod ctrl+shift
enabled_layouts fat:bias=80, tall:bias=65 #, horizontal, vertical

tab_bar_style               custom
tab_separator               slanted
tab_title_template          "|{bell_symbol or activity_symbol}| |{title}"
active_tab_title_template   "|{' ' if layout_name == 'stack' else ''}{bell_symbol}| |{title}"
tab_bar_edge                bottom
tab_bar_min_tabs            2
tab_activity_symbol         ""
bell_on_tab                 "󱐋"

# ------------------------ kitty-scrollback ------------------------
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled
# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map kitty_mod+a kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map kitty_mod+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Since my keyboard doesn't seem to detect ctrl+shift+enter
map ctrl+alt+enter launch --cwd=current 

# https://github.com/mrjones2014/smart-splits.nvim?tab=readme-ov-file#kitty
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right

# Unset the mapping to pass the keys to neovim
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+l

# the 3 here is the resize amount, adjust as needed
map kitty_mod+j kitten relative_resize.py down  2
map kitty_mod+k kitten relative_resize.py up    2
map kitty_mod+h kitten relative_resize.py left  2
map kitty_mod+l kitten relative_resize.py right 2

map --when-focus-on var:IS_NVIM kitty_mod+j
map --when-focus-on var:IS_NVIM kitty_mod+k
map --when-focus-on var:IS_NVIM kitty_mod+h
map --when-focus-on var:IS_NVIM kitty_mod+l

map ctrl+y scroll_line_up
map ctrl+e scroll_line_down
map ctrl+u scroll_page_up
map ctrl+d scroll_page_down

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
